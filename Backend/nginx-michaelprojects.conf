# Nginx — michaelprojects.org
# Estructura: /var/www/michaelprojects/{index.html, MyCalendar, marcadors, lstyle-seniors-plus, ...}
#
# Al VPS:
#   sudo nano /etc/nginx/sites-available/michaelprojects
#   (enganxar aquest contingut)
#   sudo nginx -t && sudo systemctl reload nginx
#   pm2 list   # marcadors online al port 3000

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name michaelprojects.org michaelprojects.cloud www.michaelprojects.org www.michaelprojects.cloud;

    if ($host = www.michaelprojects.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = michaelprojects.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 301 https://$host$request_uri;
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name michaelprojects.org michaelprojects.cloud www.michaelprojects.org www.michaelprojects.cloud;

    root /var/www/michaelprojects;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/michaelprojects.org-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/michaelprojects.org-0001/privkey.pem; # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Seguretat: no servir .env, .git, fitxers ocults
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Portafoli + projectes estàtics (lstyle-seniors-plus, etc.)
    location / {
        try_files $uri $uri/ =404;
    }

    # MyCalendar (HTML estàtic)
    location /MyCalendar/ {
        alias /var/www/michaelprojects/MyCalendar/;
        index index.html;
    }

    # Carpeta física "marcadors" → URL de l'app (evita exposar .env per ruta estàtica)
    location = /marcadors {
        return 301 /marcadores/;
    }
    location /marcadors/ {
        return 301 /marcadores/;
    }

    # Marcadors — app Node (PM2) port 3000 — enllaç index.html: /marcadores/
    location = /marcadores {
        return 301 /marcadores/;
    }
    location /marcadores/ {
        proxy_pass http://127.0.0.1:3000/marcadores/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # PHP (API lstyle-seniors-plus)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
