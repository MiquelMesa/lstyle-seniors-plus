<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Carregant dades">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00c8e8"/>
      <stop offset="1" stop-color="#00e676"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Anell exterior animat -->
  <circle cx="100" cy="100" r="78" stroke="rgba(0,200,232,0.15)" stroke-width="6"/>
  <circle cx="100" cy="100" r="78" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="120 370" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Servidor / base de dades -->
  <rect x="62" y="58" width="76" height="18" rx="6" fill="#132f4c" stroke="#00c8e8" stroke-width="2"/>
  <rect x="62" y="84" width="76" height="18" rx="6" fill="#132f4c" stroke="#00c8e8" stroke-width="2"/>
  <rect x="62" y="110" width="76" height="18" rx="6" fill="#132f4c" stroke="#00c8e8" stroke-width="2"/>
  <circle cx="72" cy="67" r="3" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="72" cy="93" r="3" fill="#00c8e8"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="72" cy="119" r="3" fill="#00e676"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <rect x="82" y="64" width="44" height="4" rx="2" fill="#00c8e8" opacity="0.5"/>
  <rect x="82" y="90" width="36" height="4" rx="2" fill="#00c8e8" opacity="0.5"/>
  <rect x="82" y="116" width="48" height="4" rx="2" fill="#00c8e8" opacity="0.5"/>

  <!-- Fletxes de dades -->
  <g stroke="#00e676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M100 136v18"/>
    <path d="M94 148l6 6 6-6"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- N�vol de dades -->
  <path d="M58 158h84c10 0 18-7 18-16 0-7-5-13-12-15-2-10-11-17-22-17-6 0-11 2-15 6-3-8-11-14-20-14-12 0-21 9-22 21-8 2-14 9-14 18 0 10 8 17 18 17z"
        fill="#1a3a52" stroke="url(#ring)" stroke-width="2"/>
  <text x="100" y="168" text-anchor="middle" fill="#00c8e8" font-family="monospace" font-size="11" font-weight="bold">API</text>

  <!-- Part�cules -->
  <circle cx="40" cy="100" r="3" fill="#00c8e8" opacity="0.6">
    <animate attributeName="cy" values="100;85;100" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="90" r="2.5" fill="#00e676" opacity="0.6">
    <animate attributeName="cy" values="90;105;90" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="130" r="2" fill="#00c8e8" opacity="0.5">
    <animate attributeName="cx" values="170;155;170" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
